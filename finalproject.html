<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Online Library Management System</title>

<style>
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background:#eef1f5;
}

/* Header */
header{
    background:#2c3e50;
    color:white;
    padding:20px;
    text-align:center;
}

/* Navigation */
nav{
    background:#34495e;
    text-align:center;
    padding:10px;
}

nav button{
    background:white;
    border:none;
    padding:10px 18px;
    margin:5px;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
}

nav button:hover{
    background:#1abc9c;
    color:white;
}

/* Section styling */
.section{
    display:none;
    padding:20px;
}

.active{
    display:block;
}

/* Forms */
input{
    padding:10px;
    margin:8px;
    width:250px;
}

button.submit{
    background:#1abc9c;
    border:none;
    color:white;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
}

button.submit:hover{
    background:#16a085;
}

/* Tables */
table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th, td{
    border:1px solid #ccc;
    padding:10px;
    text-align:center;
}

th{
    background:#2c3e50;
    color:white;
}

.deleteBtn{
    background:red;
    color:white;
    border:none;
    padding:5px 10px;
    border-radius:4px;
    cursor:pointer;
}
</style>
</head>
<body>

<header>
    <h1>📚 Online Library Management System</h1>
</header>

<nav>
    <button onclick="showSection('home')">Home</button>
    <button onclick="showSection('userLogin')">User Login</button>
    <button onclick="showSection('adminLogin')">Admin Login</button>
</nav>

<!-- HOME -->
<div id="home" class="section active">
    <h2>Welcome to Our Library</h2>
    <p>This website allows users to view books and admins to manage the library system.</p>
</div>

<!-- USER LOGIN -->
<div id="userLogin" class="section">
    <h2>User Login</h2>
    <input type="text" id="userName" placeholder="Username"><br>
    <input type="password" id="userPass" placeholder="Password"><br>
    <button class="submit" onclick="userLogin()">Login</button>
</div>

<!-- USER PANEL -->
<div id="userPanel" class="section">
    <h2>Available Books</h2>
    <table id="userBookTable">
        <thead>
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Category</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<!-- ADMIN LOGIN -->
<div id="adminLogin" class="section">
    <h2>Admin Login</h2>
    <input type="text" id="adminUser" placeholder="Admin Username"><br>
    <input type="password" id="adminPass" placeholder="Password"><br>
    <button class="submit" onclick="adminLogin()">Login</button>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="section">
    <h2>Admin Dashboard</h2>

    <h3>Add Book</h3>
    <input type="text" id="title" placeholder="Book Title"><br>
    <input type="text" id="author" placeholder="Author"><br>
    <input type="text" id="category" placeholder="Category"><br>
    <button class="submit" onclick="addBook()">Add Book</button>

    <h3>Library Books</h3>
    <table id="adminBookTable">
        <thead>
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Category</th>
                <th>Delete</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
// Section switching
function showSection(id){
    document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

// Default login credentials
const admin = {username:"admin", password:"1234"};
const user = {username:"user", password:"1234"};

// Admin Login
function adminLogin(){
    let u=document.getElementById("adminUser").value;
    let p=document.getElementById("adminPass").value;

    if(u===admin.username && p===admin.password){
        alert("Admin Login Successful");
        showSection("adminPanel");
        loadBooks();
    }else{
        alert("Invalid Admin Login");
    }
}

// User Login
function userLogin(){
    let u=document.getElementById("userName").value;
    let p=document.getElementById("userPass").value;

    if(u===user.username && p===user.password){
        alert("User Login Successful");
        showSection("userPanel");
        loadUserBooks();
    }else{
        alert("Invalid User Login");
    }
}

// Add Book
function addBook(){
    let title=document.getElementById("title").value;
    let author=document.getElementById("author").value;
    let category=document.getElementById("category").value;

    if(title=="" || author=="" || category==""){
        alert("Please fill all fields");
        return;
    }

    let books=JSON.parse(localStorage.getItem("books")) || [];
    books.push({title, author, category});
    localStorage.setItem("books", JSON.stringify(books));

    alert("Book Added Successfully");

    document.getElementById("title").value="";
    document.getElementById("author").value="";
    document.getElementById("category").value="";

    loadBooks();
}

// Load books in admin panel
function loadBooks(){
    let books=JSON.parse(localStorage.getItem("books")) || [];
    let table=document.querySelector("#adminBookTable tbody");
    table.innerHTML="";

    books.forEach((book,index)=>{
        table.innerHTML += `
        <tr>
            <td>${book.title}</td>
            <td>${book.author}</td>
            <td>${book.category}</td>
            <td><button class="deleteBtn" onclick="deleteBook(${index})">Delete</button></td>
        </tr>`;
    });
}

// Delete book
function deleteBook(index){
    let books=JSON.parse(localStorage.getItem("books"));
    books.splice(index,1);
    localStorage.setItem("books", JSON.stringify(books));
    loadBooks();
}

// Load books for users
function loadUserBooks(){
    let books=JSON.parse(localStorage.getItem("books")) || [];
    let table=document.querySelector("#userBookTable tbody");
    table.innerHTML="";

    books.forEach(book=>{
        table.innerHTML += `
        <tr>
            <td>${book.title}</td>
            <td>${book.author}</td>
            <td>${book.category}</td>
        </tr>`;
    });
}
</script>

</body>
</html>
